global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'markowitz-service'
    static_configs:
      - targets: ['markowitz-service:8000']
  - job_name: 'qaoa-service'
    static_configs:
      - targets: ['qaoa-service:8001']
  - job_name: 'results-api'
    static_configs:
      - targets: ['results-api:8000']
