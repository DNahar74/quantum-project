version: '3.8'

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 5s

services:
  markowitz-service:
    build:
      context: .
      dockerfile: markowitz-service/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *healthcheck

  qaoa-service:
    build:
      context: .
      dockerfile: qaoa-service/Dockerfile
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *healthcheck

  results-api:
    build:
      context: .
      dockerfile: results_api/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - results_data:/app/results_store_data
    environment:
      - DB_PATH=/app/results_store_data/results.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *healthcheck
    depends_on:
      markowitz-service:
        condition: service_healthy
      qaoa-service:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      results-api:
        condition: service_healthy

  data-loader:
    build:
      context: .
      dockerfile: data_loader/Dockerfile
    volumes:
      - ./12_Industry_Portfolios_Daily.csv:/app/12_Industry_Portfolios_Daily.csv:ro
      - processed_data:/app/data/processed
    profiles:
      - tools

  backtest-orchestrator:
    build:
      context: .
      dockerfile: backtest_orchestrator/Dockerfile
    volumes:
      - processed_data:/app/data/processed
      - results_data:/app/results_store_data
    environment:
      - DB_PATH=/app/results_store_data/results.db
      - RETURNS_FILE=/app/data/processed/daily_returns.csv
      - BACKTEST_MARKOWITZ_URL=http://markowitz-service:8000/optimize
      - BACKTEST_QAOA_URL=http://qaoa-service:8001/optimize
      - BACKTEST_START_DATE=${BACKTEST_START_DATE:-2024-01-01}
      - BACKTEST_END_DATE=${BACKTEST_END_DATE:-2024-03-31}
      - BACKTEST_WINDOW_DAYS=${BACKTEST_WINDOW_DAYS:-252}
      - BACKTEST_TCOST_BPS=${BACKTEST_TCOST_BPS:-10.0}
      - BACKTEST_RISK_AVERSION=${BACKTEST_RISK_AVERSION:-1.0}
    depends_on:
      markowitz-service:
        condition: service_healthy
      qaoa-service:
        condition: service_healthy
    profiles:
      - tools

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  processed_data:
  results_data:
